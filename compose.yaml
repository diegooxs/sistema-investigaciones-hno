services:
  mariadb:
    image: mariadb:11.4
    container_name: hno-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_hno_2027}
      MARIADB_DATABASE: ${DB_NAME:-hno_investigaciones}
      MARIADB_USER: ${DB_USER:-hno_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:-cambiar_en_desarrollo}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - hno_mariadb_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  hno_mariadb_data:
